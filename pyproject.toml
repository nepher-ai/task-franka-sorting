# This file is not the install target. Install the package with:
#   _isaac_sim\python.bat -m pip install -e source/task-franka-sorting/source/franka_sorting
# from the Isaac Lab root. That package publishes the isaaclab.tasks entry point.

[project]
name = "task-franka-sorting"
version = "0.1.0"
description = "Franka parts sorting: planner, low-level tracker, IK, overlap-free synthetic data generation for LeRobot."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source/franka_sorting", "scripts"]

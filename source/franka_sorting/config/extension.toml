[package]

version = "0.1.0"
category = "isaaclab"
readme  = "README.md"

title       = "Franka Sorting - Industrial Parts Sorting"
author      = "Nepher Robotics"
maintainer  = "Nepher Robotics"
description = "Franka parts sorting: pick randomly placed industrial parts out of a container and sort them by type into the cells of a parts tray. Classical planner, learned low-level EE tracker, IK, absolute joint commands. Overlap-free synthetic data generation for LeRobot."
